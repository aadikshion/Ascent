name: Refresh Ascent snapshot
on:
  schedule: [{ cron: '0 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run snapshot
        env: { LIVE: '1', EXPLORER_API: 'https://elysium.kinetiq.xyz/api/v2' }
      - run: |
          git config user.name "ascent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public
          git diff --staged --quiet || (git commit -m "Hourly snapshot" && git push)