<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ascent: Ascended Score Engine</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--bd:#30363d;--tx:#e6edf3;--mu:#8b949e;--g:#2ea043;--y:#d29922;--r:#da3633;--b:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,sans-serif}
header{padding:20px 24px;border-bottom:1px solid var(--bd)}h1{margin:0;font-size:20px}header p{margin:4px 0 0;color:var(--mu)}
.mode{display:inline-block;padding:1px 8px;border-radius:10px;border:1px solid var(--bd);font-size:12px;margin-left:8px;color:var(--y)}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:16px 24px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:12px}tr.row{cursor:pointer}tr.row:hover,tr.sel{background:#1c2330}
.pill{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.bar{height:8px;background:#222a35;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.flag{padding:6px 10px;border-left:3px solid;margin:6px 0;background:#10151c;border-radius:0 4px 4px 0}
.critical{border-color:var(--r)}.warn{border-color:var(--y)}.info{border-color:var(--b)}
.lbl{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin-top:10px}
h3{margin:14px 0 4px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
code{background:#10151c;padding:2px 6px;border-radius:4px;font-size:12px}
</style></head><body>
<header><h1>Ascent <span id="mode" class="mode"></span></h1>
<p>Live Ascended Score, anti-sybil clustering and buyback estimates for tokens launched on Ascend.</p></header>
<main>
<section class="card"><table><thead><tr><th>Token</th><th>Score</th><th>Real holders</th><th>Mkt cap</th><th>TW volume/day</th><th>Top 5</th><th>Linked</th><th>Est. buyback</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></section>
<section class="card" id="detail"><p style="color:var(--mu)">Select a token to see its breakdown.</p></section>
</main>
<script>
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const col=(s)=>s>=60?'var(--g)':s>=40?'var(--y)':'var(--r)';
const usd=(n)=>'$'+Number(n).toLocaleString();
let tokens=[];
function bar(label,v,hint){return `<div class="lbl"><span>${label}</span><span>${v}/100${hint?' · '+esc(hint):''}</span></div><div class="bar"><i style="width:${v}%;background:${col(v)}"></i></div>`}
function show(sym){
  const t=tokens.find(x=>x.symbol===sym);if(!t)return;
  document.querySelectorAll('tr.row').forEach(r=>r.classList.toggle('sel',r.dataset.s===sym));
  $('#detail').innerHTML=`<h2 style="margin:0">${esc(t.symbol)} <span class="pill" style="background:${col(t.score)}">${t.score}/100</span></h2>
  <div style="color:var(--mu);font-size:12px">${esc(t.address)}</div>
  ${bar('Unique holders',t.components.holders,t.effHolders+' independent ('+t.rawHolders+' wallets)')}
  ${bar('Time-weighted volume',t.components.volume,usd(t.twVolume)+'/day')}
  ${bar('Market cap',t.components.mcap,usd(t.marketCap))}
  ${bar('Concentration',t.components.concentration,'top 5 = '+t.top5+'%')}
  <div class="lbl"><span>Coordination penalty</span><span>-${t.penalty} pts</span></div>
  <h3>Red flags</h3>${t.flags.length?t.flags.map(f=>`<div class="flag ${f.level}">${esc(f.text)}</div>`).join(''):'<div class="flag info">No flags detected</div>'}
  <h3>Path to Ascended</h3><ul style="margin:4px 0;padding-left:18px">${t.path.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
  <h3>Largest entities</h3><table>${t.topEntities.map(e=>`<tr><td>${e.share}%</td><td>${e.wallets} wallet${e.wallets>1?'s':''}</td><td style="color:var(--y)">${esc(e.reasons.join(', '))}</td></tr>`).join('')}</table>
  <h3>Estimated buyback share</h3>${t.buyback.share}% (~${usd(t.buyback.usd)} of the modelled pool)
  <h3>Embed badge</h3><code>&lt;img src="/api/badge/${esc(t.symbol)}.svg"&gt;</code><br><br><img src="/api/badge/${encodeURIComponent(t.symbol)}.svg">`;
}
fetch('/api/tokens').then(r=>r.json()).then(d=>{
  $('#mode').textContent=d.mode==='live'?'LIVE':'DEMO DATA';tokens=d.tokens.sort((a,b)=>b.score-a.score);
  $('#rows').innerHTML=tokens.map(t=>`<tr class="row" data-s="${esc(t.symbol)}"><td><b>${esc(t.symbol)}</b></td><td><span class="pill" style="background:${col(t.score)}">${t.score}</span></td><td>${t.effHolders}</td><td>${usd(t.marketCap)}</td><td>${usd(t.twVolume)}</td><td>${t.top5}%</td><td>${t.clusteredShare}%</td><td>${t.buyback.share}%</td><td>${t.eligible?'<span style="color:var(--g)">Likely eligible</span>':'<span style="color:var(--r)">Not yet</span>'}</td></tr>`).join('');
  document.querySelectorAll('tr.row').forEach(r=>r.onclick=()=>show(r.dataset.s));
  if(tokens[0])show(tokens[0].symbol);
});
</script></body></html>
